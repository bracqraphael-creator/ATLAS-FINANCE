[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-engine"
version = "0.1.0"
description = "Moteur de calcul d'ATLAS FINANCE : imports, positions, modules d'analyse"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.modules" = ["*/manifest.json", "*/texts.fr.json"]
"atlas" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
